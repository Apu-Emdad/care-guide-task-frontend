name: care-guide-task-frontend

services:
  web:
    build:
      context: .
      target: runtime
      args:
        # Baked into the build: the address the browser uses to reach the API
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    image: care-guide-task-frontend-web
    container_name: care-guide-task-frontend-web
    restart: unless-stopped
    # 5001 matches WEB_ORIGIN in the API's .env, which CORS and the refresh cookie need
    ports:
      - '5001:4173'
